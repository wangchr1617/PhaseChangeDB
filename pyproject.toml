[project]
name = "phasechangedb"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "asyncmy>=0.2,<1.0",
    "cryptography>=42.0,<46.0",
    "fastapi>=0.128,<1.0",
    "greenlet>=3.0,<4.0",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uuid6>=2025.0.1",
    "uvicorn[standard]>=0.35,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "ruff>=0.12,<1.0",
]
